<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indoor Golf Mag | Everything you need to know</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <!-- Logo a Slogan -->
            <div class="logo-area">
                <a href="/" class="logo-text">INDOOR GOLF <span>MAG</span></a>
                <p class="slogan">Everything you need to know about indoor golf</p>
            </div>

            <!-- Hlavné kategórie (Tlačidlá s borderom) -->
            <nav class="main-nav">
                <a href="/launch-monitors/" class="btn-nav">Launch Monitors</a>
                <a href="/software/" class="btn-nav">Software</a>
            </nav>

            <!-- Vyhľadávanie -->
            <div class="search-area">
                <input type="text" id="search-input" placeholder="Search articles...">
                <div id="search-results" class="search-suggestions"></div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="content-wrapper">
            
            <!-- Hlavná blogová časť (3 stĺpce široká) -->
            <section class="articles-grid" id="articles-container">
                <!-- Tu sa budú zobrazovať články cez JS -->
                <p>Loading latest indoor golf news...</p>
            </section>

            <!-- Sidebar (1 stĺpec široký) -->
            <aside class="sidebar">
                <div class="sidebar-block">
                    <h3>Featured</h3>
                    <div id="featured-list">
                        <!-- Priestor pre top články -->
                    </div>
                </div>

                <div class="sidebar-block ad-placeholder">
                    <p>Advertisement</p>
                    <!-- Tu pôjde neskôr Google AdSense kód -->
                </div>
            </aside>

        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2024 Indoor Golf Mag. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
